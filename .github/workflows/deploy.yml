name: Deploy Automático para Hostgator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deploy payload
        run: |
          test -f artisan
          test -d public
          echo "Deploy payload ready."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, dom, xml, bcmath, curl, zip, fileinfo
          coverage: none

      # Instala as dependências PHP apenas no runner, para os comandos artisan
      # abaixo (static-content:sync, patrimonios:sync-qrcodes) funcionarem.
      # O vendor/ NÃO é enviado por FTP aqui (são ~40 mil arquivos e a
      # hospedagem compartilhada recusa a conexão de dados). O vendor/ é
      # publicado como um único vendor.zip pelo workflow "deploy-vendor.yml".
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run build

      # Mesmo que `php artisan storage:publish` (local = produção)
      - name: Publish public storage
        run: |
          rm -rf public/storage
          mkdir -p public/storage
          cp -a storage/app/public/. public/storage/

      - name: Sync static content (production database)
        continue-on-error: true
        run: php artisan static-content:sync
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Gera os QR codes dos patrimônios existentes para envio estático (como os editais).
      # Patrimônios criados após o deploy usam a geração dinâmica na rota de QR code.
      - name: Generate patrimonio QR codes (production database)
        continue-on-error: true
        run: php artisan patrimonios:sync-qrcodes
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            vendor.zip
            .github/**

      - name: Clear production page cache (FTP)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            cd storage/framework/cache/data;
            glob -a rm -r *;
            bye
          "
        continue-on-error: true